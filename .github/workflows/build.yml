# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Build and Test

on:
  workflow_dispatch:
  push:
  pull_request:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Create Build Image
      run: docker-build/obtain_build_image.sh

    - name: Build all platforms
      run: docker run --rm -v "$(pwd):/workdir" unifmu-build:latest docker-build/build_all.sh

    - name: Prepare native tests
      uses: ./.github/actions/native-test-setup

    - name: Build Java runtime library
      run: ./assets/java/gradlew -p assets/java/runtime build

    - name: Test on Linux host
      run: ./test.sh

    - name: artifact
      uses: actions/upload-artifact@v6
      with:
        name: unifmu-build-artifacts
        path: |
          target/unifmu-*.zip
          assets/java/runtime/build/libs/unifmu-java-runtime-*.jar
        retention-days: 7
