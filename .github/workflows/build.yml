# This workflow will build a Java project with Maven
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Build and Test

on:
  workflow_dispatch:
  push:
  pull_request:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

# initial image is build using docker buildx build   --build-arg BUILDKIT_INLINE_CACHE=1   -t   lausdahl/unifmu-build:latest  --push . from the docker folder

    - name: Create Build Image
      run: docker buildx build --progress=plain --build-arg BUILDKIT_INLINE_CACHE=1 --cache-from lausdahl/unifmu-build:latest -t unifmu-build:latest -f docker-build/Dockerfile docker-build

    - name: Build and Test
      run: docker run --rm -v "$(pwd):/workdir" unifmu-build:latest docker-build/build_all.sh

    - name: artifact
      uses: actions/upload-artifact@v6
      with:
        name: unifmu-build-artifacts
        path: |
          target/unifmu-*.zip
        retention-days: 7
